# Reusable segmented leaf spring. Geometry inputs are initial global points.

[assembly]
name = "leaf_spring"
dimension = "spatial"

[interface.frame]
kind = "body_or_ground"

[interface.leaf]
kind = "body"

[parameters]
front_eye = { kind = "vector", required = true }
leaf_center = { kind = "vector", required = true }
rear_shackle_eye = { kind = "vector", required = true }
rear_frame_eye = { kind = "vector", required = true }
up = { kind = "vector", default = [0.0, 0.0, 1.0] }
leaf_stiffness = { kind = "number", required = true }
twist_stiffness = { kind = "number", default = 0.0 }
width = { kind = "number", required = true }
thickness = { kind = "number", default = "=width/5" }
mount_stiffness = { kind = "vector", required = true }
mount_rotational_stiffness = { kind = "vector", required = true }
damping_time_scale = { kind = "number", default = 0.006 }
nominal_load = { kind = "number", default = 0.0 }
density = { kind = "number", default = 7850.0 }
leaf_color = { kind = "string", default = "steelblue" }
shackle_color = { kind = "string", default = "darkorange" }

[calculate]
spring_axis = "=unit(front_eye-rear_shackle_eye)"
up_axis = "=unit(up-dot(up,spring_axis)*spring_axis)"
side_axis = "=unit(cross(spring_axis,up_axis))"
spring_frame = "=frame(spring_axis,up_axis,side_axis)"
universal_link_frame = "=frame(spring_axis,side_axis,-up_axis)"
shackle_axis = "=unit(rear_frame_eye-rear_shackle_eye)"
shackle_side = "=unit(side_axis-dot(side_axis,shackle_axis)*shackle_axis)"
shackle_up = "=cross(shackle_side,shackle_axis)"
shackle_frame = "=frame(shackle_axis,shackle_up,shackle_side)"
shackle_spring_x = "=[dot(shackle_axis,spring_axis),dot(shackle_up,spring_axis),dot(shackle_side,spring_axis)]"
shackle_spring_y = "=[dot(shackle_axis,up_axis),dot(shackle_up,up_axis),dot(shackle_side,up_axis)]"
shackle_spring_z = "=[dot(shackle_axis,side_axis),dot(shackle_up,side_axis),dot(shackle_side,side_axis)]"
shackle_spring_frame = "=frame(shackle_spring_x,shackle_spring_y,shackle_spring_z)"
front_length = "=abs(dot(front_eye-leaf_center,spring_axis))"
rear_length = "=abs(dot(rear_shackle_eye-leaf_center,spring_axis))"
total_length = "=front_length+rear_length"
front_inner = "=leaf_center+0.25*front_length*spring_axis"
rear_inner = "=leaf_center-0.25*rear_length*spring_axis"
front_bending_stiffness = "=leaf_stiffness*rear_length/total_length*(0.75*front_length)^2"
rear_bending_stiffness = "=leaf_stiffness*front_length/total_length*(0.75*rear_length)^2"
front_nominal_angle = "=-(0.5*nominal_load*0.75*front_length)/front_bending_stiffness"
rear_nominal_angle = "=-(-0.5*nominal_load*0.75*rear_length)/rear_bending_stiffness"
front_center = "=0.5*(front_eye+front_inner)"
rear_center = "=0.5*(rear_inner+rear_shackle_eye)"
shackle_center = "=0.5*(rear_shackle_eye+rear_frame_eye)"
front_span = "=norm(front_inner-front_eye)"
rear_span = "=norm(rear_shackle_eye-rear_inner)"
shackle_span = "=norm(rear_frame_eye-rear_shackle_eye)"
center_span = "=norm(rear_inner-front_inner)"
front_size = "=[front_span,thickness,width]"
rear_size = "=[rear_span,thickness,width]"
shackle_size = "=[shackle_span,thickness,width]"
center_size = "=[center_span,thickness,width]"
front_mass = "=density*front_span*thickness*width"
rear_mass = "=density*rear_span*thickness*width"
shackle_mass = "=density*shackle_span*thickness*width"
front_inertia = "=box_inertia(front_mass,front_size)"
rear_inertia = "=box_inertia(rear_mass,rear_size)"
shackle_inertia = "=box_inertia(shackle_mass,shackle_size)"

[front_link]
type = "rigid_body"
mass = "=front_mass"
inertia = "=front_inertia"
center_of_mass = "front_link.cm"
position = "=front_center"

[front_link.cm]
type = "marker"
orientation = "=spring_frame"

[front_link.graphics]
shape = "box"
marker = "front_link.cm"
size = "=front_size"
color = "=leaf_color"

[rear_link]
type = "rigid_body"
mass = "=rear_mass"
inertia = "=rear_inertia"
center_of_mass = "rear_link.cm"
position = "=rear_center"

[rear_link.cm]
type = "marker"
orientation = "=spring_frame"

[rear_link.graphics]
shape = "box"
marker = "rear_link.cm"
size = "=rear_size"
color = "=leaf_color"

[shackle]
type = "rigid_body"
mass = "=shackle_mass"
inertia = "=shackle_inertia"
center_of_mass = "shackle.cm"
position = "=shackle_center"
orientation = "=shackle_frame"

[shackle.cm]
type = "marker"

[shackle.graphics]
shape = "box"
marker = "shackle.cm"
size = "=shackle_size"
color = "=shackle_color"

# The central leaf is supplied by the enclosing model. This adds its leaf
# graphic without changing that body's mass properties.
[leaf.center]
type = "marker"
position = "=local_point(leaf,leaf_center)"
orientation = "=local_frame(leaf,spring_frame)"

[leaf.graphics.central_leaf]
shape = "box"
marker = "leaf.center"
size = "=center_size"
color = "=leaf_color"

[leaf.front_joint]
type = "marker"
position = "=local_point(leaf,front_inner)"
orientation = "=local_frame(leaf,spring_frame)"

[front_link.inner_joint]
type = "marker"
position = "=front_inner-front_center"
orientation = "=universal_link_frame"

[front_universal.spherical]
type = "spherical"
markers = ["leaf.front_joint", "front_link.inner_joint"]

[front_universal.perp]
type = "perp"
markers = ["leaf.front_joint", "front_link.inner_joint"]

[leaf.rear_joint]
type = "marker"
position = "=local_point(leaf,rear_inner)"
orientation = "=local_frame(leaf,spring_frame)"

[rear_link.inner_joint]
type = "marker"
position = "=rear_inner-rear_center"
orientation = "=universal_link_frame"

[rear_universal.spherical]
type = "spherical"
markers = ["leaf.rear_joint", "rear_link.inner_joint"]

[rear_universal.perp]
type = "perp"
markers = ["leaf.rear_joint", "rear_link.inner_joint"]

[leaf.front_bushing]
type = "marker"
position = "=local_point(leaf,front_inner)"
orientation = "=local_frame(leaf,spring_frame)"

[front_link.inner_bushing]
type = "marker"
position = "=front_inner-front_center"
orientation = "=compose(spring_frame,rotation(front_nominal_angle,[0.0,0.0,1.0]))"

[front_bending]
type = "bushing"
markers = ["front_link.inner_bushing", "leaf.front_bushing"]
translational_stiffness = [0.0, 0.0, 0.0]
rotational_stiffness = "=[twist_stiffness,twist_stiffness,front_bending_stiffness]"
damping_time_scale = "=damping_time_scale"

[leaf.rear_bushing]
type = "marker"
position = "=local_point(leaf,rear_inner)"
orientation = "=local_frame(leaf,spring_frame)"

[rear_link.inner_bushing]
type = "marker"
position = "=rear_inner-rear_center"
orientation = "=compose(spring_frame,rotation(rear_nominal_angle,[0.0,0.0,1.0]))"

[rear_bending]
type = "bushing"
markers = ["rear_link.inner_bushing", "leaf.rear_bushing"]
translational_stiffness = [0.0, 0.0, 0.0]
rotational_stiffness = "=[twist_stiffness,twist_stiffness,rear_bending_stiffness]"
damping_time_scale = "=damping_time_scale"

[front_link.frame_eye]
type = "marker"
position = "=front_eye-front_center"
orientation = "=spring_frame"

[frame.front_eye]
type = "marker"
position = "=local_point(frame,front_eye)"
orientation = "=local_frame(frame,spring_frame)"

[front_mount]
type = "bushing"
markers = ["front_link.frame_eye", "frame.front_eye"]
translational_stiffness = "=mount_stiffness"
rotational_stiffness = "=mount_rotational_stiffness"
damping_time_scale = "=damping_time_scale"

[rear_link.shackle_eye]
type = "marker"
position = "=rear_shackle_eye-rear_center"
orientation = "=spring_frame"

[shackle.leaf_eye]
type = "marker"
position = "=[-0.5*shackle_span,0.0,0.0]"
orientation = "=shackle_spring_frame"

[rear_mount]
type = "bushing"
markers = ["rear_link.shackle_eye", "shackle.leaf_eye"]
translational_stiffness = "=mount_stiffness"
rotational_stiffness = "=mount_rotational_stiffness"
damping_time_scale = "=damping_time_scale"

[shackle.frame_eye]
type = "marker"
position = "=[0.5*shackle_span,0.0,0.0]"
orientation = "=shackle_spring_frame"

[frame.shackle_eye]
type = "marker"
position = "=local_point(frame,rear_frame_eye)"
orientation = "=local_frame(frame,spring_frame)"

[shackle_mount]
type = "bushing"
markers = ["shackle.frame_eye", "frame.shackle_eye"]
translational_stiffness = "=mount_stiffness"
rotational_stiffness = "=mount_rotational_stiffness"
damping_time_scale = "=damping_time_scale"
