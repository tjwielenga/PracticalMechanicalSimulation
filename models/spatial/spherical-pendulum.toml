[model]
name = "spherical_pendulum"
title = "Spatial pendulum with a spherical joint"
dimension = "spatial"

[analysis]
mode = "automatic"

[simulation]
start_time = 0.0
end_time = 3.0
output_samples = 301
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.01

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.pin]
type = "marker"
position = [0.0, 0.0, 0.0]

[ground.pin.graphics]
shape = "xy_frame"
axis_length = 0.35
plane_size = 0.16
plane_color = "gray65"
label = "ground.pin"

[pendulum]
type = "rigid_body"
mass = 1.0
inertia = [0.001, 0.08333333333333333, 0.08333333333333333]
position = [0.5, 0.0, 0.0]

[pendulum.graphics]
shape = "box"
size = [1.0, 0.08, 0.08]
color = "steelblue"

[pendulum.pin]
type = "marker"
position = [-0.5, 0.0, 0.0]

[pendulum.tip]
type = "marker"
position = [0.5, 0.0, 0.0]

[pendulum.tip.graphics]
shape = "xy_frame"
axis_length = 0.18
plane_size = 0.07
plane_color = "lightskyblue"
opacity = 0.16
label = "pendulum.tip"

[pin]
type = "spherical"
markers = ["pendulum.pin", "ground.pin"]

[gravity]
type = "gravity"
acceleration = [0.0, 0.0, -9.81]
bodies = ["pendulum"]
