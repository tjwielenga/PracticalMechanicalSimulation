[model]
name = "static_inverted_spherical_pendulum"
title = "Static equilibrium from an inverted spherical pendulum"
dimension = "spatial"

[analysis]
mode = "static"
static_method = "dynamic_relaxation"
relaxation_duration = 1.0
relaxation_reduction_factor = 0.25
relaxation_min_cycles = 1
relaxation_max_cycles = 20

[simulation]
start_time = 0.0
end_time = 0.0
output_samples = 1
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.005

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.pin]
type = "marker"

[ground.pin.graphics]
shape = "xy_frame"
axis_length = 0.35
plane_size = 0.16
plane_color = "gray65"
label = "spherical support"

[pendulum]
type = "rigid_body"
mass = 1.0
inertia = [0.001, 0.08333333333333333, 0.08333333333333333]
position = [0.03569690242163483, 0.02499524016636515, 0.4980973490458728]
orientation = [
    [0.07139380484326965, -0.573576436351046, -0.8160349234517084],
    [0.0499904803327303, 0.8191520442889918, -0.5713938048432696],
    [0.9961946980917455, 0.0, 0.08715574274765817],
]

[pendulum.graphics]
shape = "box"
size = [1.0, 0.08, 0.08]
color = "steelblue"

[pendulum.pin]
type = "marker"
position = [-0.5, 0.0, 0.0]

[pendulum.tip]
type = "marker"
position = [0.5, 0.0, 0.0]

[pendulum.tip.graphics]
shape = "xy_frame"
axis_length = 0.18
plane_size = 0.07
plane_color = "lightskyblue"
opacity = 0.16
label = "pendulum tip"

[pin]
type = "spherical"
markers = ["pendulum.pin", "ground.pin"]

[gravity]
type = "gravity"
acceleration = [0.0, 0.0, -9.81]
bodies = ["pendulum"]
