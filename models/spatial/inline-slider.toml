[model]
name = "inline_slider"
title = "Spatial body falling along an inline constraint"
dimension = "spatial"

[analysis]
mode = "automatic"

[state_selection]
method = "preferred"
preferred_velocities = [
    "guide.velocity",
    "slider.omega_x",
    "slider.omega_y",
    "slider.omega_z",
]
allow_fallback = false

[simulation]
start_time = 0.0
end_time = 1.0
output_samples = 201
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.01

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.axis]
type = "marker"

[ground.axis.graphics]
shape = "xy_frame"
axis_length = 0.30
plane_size = 0.16
plane_color = "gray70"
opacity = 0.18
label = "inline axis"

[slider]
type = "rigid_body"
mass = 1.0
inertia = [0.015, 0.020, 0.025]
position = [0.0, 0.0, 1.0]
orientation = ["30°", 0.0, 0.0, 1.0]

[slider.graphics]
shape = "box"
size = [0.35, 0.25, 0.20]
color = "steelblue"

[slider.center]
type = "marker"

[guide]
type = "inline"
markers = ["slider.center", "ground.axis"]
translation_coordinates = true

[gravity]
type = "gravity"
acceleration = [0.0, 0.0, -9.81]
bodies = ["slider"]
