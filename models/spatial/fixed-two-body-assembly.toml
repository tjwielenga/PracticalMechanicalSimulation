[model]
name = "fixed_two_body_assembly"
title = "Two bodies joined by a spatial fixed joint"
dimension = "spatial"

[analysis]
mode = "automatic"

[simulation]
start_time = 0.0
end_time = 1.2
output_samples = 241
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.01

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.world]
type = "marker"
position = [-0.6, -0.5, 0.0]

[ground.world.graphics]
shape = "xy_frame"
axis_length = 0.35
plane_size = 0.16
plane_color = "gray70"
opacity = 0.16
label = "world"

[base]
type = "rigid_body"
mass = 1.2
inertia = [0.004, 0.065, 0.068]
position = [0.0, 0.0, 1.0]
velocity = [0.5, -0.3, 0.28]
angular_velocity = [0.5, 0.7, 1.0]

[base.graphics]
shape = "box"
size = [0.80, 0.16, 0.12]
color = "steelblue"

[base.joint]
type = "marker"
position = [0.4, 0.0, 0.0]

[base.joint.graphics]
shape = "xy_frame"
axis_length = 0.24
plane_size = 0.10
plane_color = "lightskyblue"
opacity = 0.18
label = "fixed joint"

[arm]
type = "rigid_body"
mass = 0.8
inertia = [0.003, 0.034, 0.036]
position = [0.4, 0.35, 1.0]
velocity = [0.15, 0.1, 0.175]
angular_velocity = [0.7, -0.5, 1.0]
orientation = ["90 deg", 0.0, 0.0, 1.0]

[arm.graphics]
shape = "box"
size = [0.70, 0.14, 0.10]
color = "darkorange"

[arm.joint]
type = "marker"
position = [-0.35, 0.0, 0.0]
orientation = ["-90 deg", 0.0, 0.0, 1.0]

[weld]
type = "fixed"
markers = ["base.joint", "arm.joint"]

[gravity]
type = "gravity"
acceleration = [0.0, 0.0, -9.81]
bodies = ["base", "arm"]
