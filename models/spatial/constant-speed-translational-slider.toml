[model]
name = "constant_speed_translational_slider"
title = "Spatial constant-speed translational slider"
dimension = "spatial"

[parameters]
speed = 0.4

[analysis]
mode = "automatic"

[simulation]
start_time = 0.0
end_time = 1.5
output_samples = 201
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.01

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.axis]
type = "marker"

[ground.axis.graphics]
shape = "xy_frame"
axis_length = 0.3
plane_size = 0.14
plane_color = "gray65"
label = "translation axis"

[slider]
type = "rigid_body"
mass = 1.0
inertia = [0.003, 0.003, 0.002]
position = [0.0, 0.0, 0.2]
velocity = [0.0, 0.0, 0.4]

[slider.graphics]
shape = "box"
size = [0.12, 0.12, 0.3]
color = "steelblue"

[slider.axis]
type = "marker"

[guide]
type = "inline"
markers = ["slider.axis", "ground.axis"]

[orientation]
type = "orient"
markers = ["slider.axis", "ground.axis"]

[drive]
type = "translational_motion"
markers = ["slider.axis", "ground.axis"]
function = "constant_speed"
initial_distance = 0.2
velocity = "speed"

[gravity]
type = "gravity"
acceleration = [0.0, 0.0, -9.81]
bodies = ["slider"]
