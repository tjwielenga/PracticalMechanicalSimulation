[model]
name = "static_initialized_torsional_pendulum"
title = "Spatial statically initialized torsional pendulum"
dimension = "spatial"

[analysis]
mode = "dynamic"
initialization = "static_equilibrium"

[state_selection]
method = "preferred"
preferred_velocities = ["pin.omega"]
allow_fallback = false

[simulation]
start_time = 0.0
end_time = 2.0
output_samples = 401
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.005

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.pin]
type = "marker"

[ground.pin.graphics]
shape = "xy_frame"
axis_length = 0.35
plane_size = 0.16
plane_color = "gray65"
label = "revolute axis"

[pendulum]
type = "rigid_body"
mass = 1.0
inertia = [0.001, 0.08333333333333333, 0.08333333333333333]
position = [0.4330127018922193, 0.25, 0.0]
orientation = ["30 deg", 0.0, 0.0, 1.0]

[pendulum.graphics]
shape = "box"
size = [1.0, 0.08, 0.08]
color = "steelblue"

[pendulum.pin]
type = "marker"
position = [-0.5, 0.0, 0.0]

[pin]
type = "revolute"
markers = ["pendulum.pin", "ground.pin"]

[pin.initial.impose]
omega = 1.0

[spring]
type = "applied_torque"
joint = "pin"
stiffness = 8.0
damping_time_scale = 0.03
free_angle = "0 deg"

[gravity]
type = "gravity"
acceleration = [0.0, -9.81, 0.0]
bodies = ["pendulum"]
