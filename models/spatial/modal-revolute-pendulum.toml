[model]
name = "modal_revolute_pendulum"
title = "Linear mode of a spatial torsional pendulum"
dimension = "spatial"

[analysis]
mode = "modal"
modes = 1
frequency_shift_hz = 0.0

[state_selection]
method = "preferred"
preferred_velocities = ["pin.omega"]
allow_fallback = false

[simulation]
start_time = 0.0

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.pin]
type = "marker"

[ground.pin.graphics]
shape = "xy_frame"
axis_length = 0.35
plane_size = 0.16
plane_color = "gray65"
label = "revolute axis"

[pendulum]
type = "rigid_body"
mass = 1.0
inertia = [0.001, 0.08333333333333333, 0.08333333333333333]
position = [0.5, 0.0, 0.0]

[pendulum.graphics]
shape = "box"
size = [1.0, 0.08, 0.08]
color = "steelblue"

[pendulum.pin]
type = "marker"
position = [-0.5, 0.0, 0.0]

[pin]
type = "revolute"
markers = ["pendulum.pin", "ground.pin"]
rotation_coordinates = true

[spring]
type = "applied_torque"
joint = "pin"
stiffness = 8.0
damping_time_scale = 0.03
free_angle = "0 deg"
