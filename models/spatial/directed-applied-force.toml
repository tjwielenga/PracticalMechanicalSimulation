[model]
name = "directed_applied_force"
title = "Spatial marker-directed applied force"
dimension = "spatial"

[analysis]
mode = "automatic"

[simulation]
start_time = 0.0
end_time = 0.8
output_samples = 161
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.01

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.force_axis]
type = "marker"
position = [-0.45, -0.35, 0.0]
orientation = ["-20 deg", 1.0, 0.0, 0.0]

[ground.force_axis.graphics]
shape = "xy_frame"
axis_length = 0.35
plane_size = 0.16
plane_color = "gray70"
opacity = 0.18
label = "force direction"

[body]
type = "rigid_body"
mass = 1.0
inertia = [0.025, 0.035, 0.045]
position = [0.0, 0.0, 0.45]
orientation = ["15 deg", 0.0, 1.0, 0.0]

[body.graphics]
shape = "box"
size = [0.50, 0.25, 0.20]
color = "steelblue"

[body.application]
type = "marker"
position = [0.25, 0.08, 0.0]

[push]
type = "applied_force"
markers = ["body.application", "ground.force_axis"]
force = 12.0

[gravity]
type = "gravity"
acceleration = [0.0, 0.0, -9.81]
bodies = ["body"]
