[model]
name = "inplane_slider"
title = "Spatial body sliding on an inplane constraint"
dimension = "spatial"

[analysis]
mode = "automatic"

[state_selection]
method = "preferred"
preferred_velocities = [
    "slider.V_x",
    "slider.V_y",
    "slider.omega_x",
    "slider.omega_y",
    "slider.omega_z",
]
allow_fallback = false

[simulation]
start_time = 0.0
end_time = 3.0
output_samples = 301
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.01

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.plane]
type = "marker"

[ground.plane.graphics]
shape = "xy_frame"
axis_length = 0.35
plane_size = 1.8
plane_color = "gray70"
opacity = 0.18
label = "constraint plane"

[slider]
type = "rigid_body"
mass = 1.0
inertia = [0.010833333333333334, 0.016666666666666666, 0.02416666666666667]
position = [0.0, 0.0, 0.1]
velocity = [0.45, 0.20, 0.0]

[slider.graphics]
shape = "box"
size = [0.4, 0.3, 0.2]
color = "steelblue"

[slider.contact]
type = "marker"
position = [0.0, 0.0, -0.1]

[support]
type = "inplane"
markers = ["slider.contact", "ground.plane"]

[gravity]
type = "gravity"
acceleration = [0.0, 0.0, -9.81]
bodies = ["slider"]
