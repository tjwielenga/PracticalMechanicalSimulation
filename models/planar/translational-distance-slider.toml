[model]
name = "translational_distance_slider"
title = "Slider driven by a translational distance generator"
dimension = "planar"

[parameters]
drive_speed = 0.4

[analysis]
mode = "automatic"

[simulation]
start_time = 0.0
end_time = 2.0
output_samples = 201
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.01

[ground]
type = "ground"

[ground.guide]
type = "marker"
orientation = 1.5707963267948966

[ground.drive_axis]
type = "marker"

[ground.orientation]
type = "marker"

[slider]
type = "rigid_body"
mass = 1.0
inertia = 0.03

[slider.center]
type = "marker"

[slider.left]
type = "marker"
position = [-0.3, 0.0]

[slider.right]
type = "marker"
position = [0.3, 0.0]

[guide_position]
type = "inplane"
markers = ["slider.center", "ground.guide"]

[guide_orientation]
type = "perp"
markers = ["slider.center", "ground.orientation"]

[drive]
type = "translational_motion"
markers = ["slider.center", "ground.drive_axis"]
function = "constant_speed"
initial_distance = 0.0
velocity = "drive_speed"

[gravity]
type = "gravity"
bodies = ["slider"]
acceleration = [0.0, -9.81]
