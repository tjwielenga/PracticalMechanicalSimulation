[model]
name = "constant_speed_slider_crank"
title = "Constant-speed slider-crank from TOML"
dimension = "planar"

[parameters]
crank_speed = 1.2566370614359172

[graphics]
background = "white"
body_palette = "colorblind"

[graphics.colors]
crank_color = "steelblue"
rod_color = "darkorange"
ground_color = "dimgray"
guide_color = "seagreen"
joint_color = "slategray"

[simulation]
start_time = 0.0
end_time = 5.0
output_samples = 81

[ground]
type = "ground"

[ground.graphics]
color = "ground_color"

[ground.graphics.base]
shape = "box"
marker = "ground.origin"
size = [0.18, 0.12, 0.08]

[ground.origin]
type = "marker"

[crank]
type = "rigid_body"
mass = 1.0
inertia = 0.020833333333333332
position = [0.25, 0.0]

[crank.graphics]
show_default = false
color = "crank_color"

[crank.graphics.member]
shape = "cylinder"
markers = ["crank.ground_end", "crank.end"]
radius = 0.04

[crank.graphics.hub]
shape = "cylinder"
marker = "crank.ground_end"
axis = "z"
length = 0.10
radius = 0.07

[crank.graphics.pin]
shape = "sphere"
marker = "crank.end"
radius = 0.055

[crank.ground_end]
type = "marker"
position = [-0.25, 0.0]

[crank.end]
type = "marker"
position = [0.25, 0.0]

[rod]
type = "rigid_body"
mass = 2.0
inertia = 0.16666666666666666
position = [1.0, 0.0]

[rod.graphics]
show_default = false
color = "rod_color"

[rod.graphics.member]
shape = "cylinder"
markers = ["rod.crank_end", "rod.slider_end"]
radius = 0.05

[rod.graphics.slider_pin]
shape = "sphere"
marker = "rod.slider_end"
radius = 0.06

[rod.crank_end]
type = "marker"
position = [-0.5, 0.0]

[rod.slider_end]
type = "marker"
position = [0.5, 0.0]

[ground_pin]
type = "revolute"
markers = ["crank.ground_end", "ground.origin"]

[ground_pin.graphics]
color = "joint_color"

[crank_pin]
type = "revolute"
markers = ["crank.end", "rod.crank_end"]

[crank_pin.graphics]
show_default = false

[slider]
type = "inplane"
markers = ["rod.slider_end", "ground.origin"]

[slider.graphics]
color = "guide_color"
opacity = 0.35

[gravity]
type = "gravity"
bodies = ["crank", "rod"]
acceleration = [0.0, -9.81]

[crank_drive]
type = "rotational_motion"
markers = ["crank.ground_end", "ground.origin"]
function = "constant_speed"
initial_angle = 0.0
angular_velocity = "crank_speed"
