[model]
name = "torsional_spring_pendulum"
title = "Pendulum with a torsional spring-damper"
dimension = "planar"

[analysis]
mode = "dynamic"

[simulation]
start_time = 0.0
end_time = 5.0
output_samples = 301
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.005

[ground]
type = "ground"

[ground.origin]
type = "marker"

[pendulum]
type = "rigid_body"
mass = 1.0
inertia = 0.08333333333333333
position = [0.3535533905932738, -0.3535533905932738]
orientation = 0.7853981633974483

[pendulum.pin]
type = "marker"
position = [0.0, 0.5]

[pendulum.tip]
type = "marker"
position = [0.0, -0.5]

[pin]
type = "revolute"
markers = ["pendulum.pin", "ground.origin"]
rotation_coordinates = true

[pin_spring]
type = "torsional_spring_damper"
markers = ["pendulum.pin", "ground.origin"]
stiffness = 3.0
damping_time_scale = 0.1
free_angle = 0.0

[gravity]
type = "gravity"
bodies = ["pendulum"]
acceleration = [0.0, -9.81]

[state_selection]
method = "preferred"
preferred_velocities = ["pin.omega"]
allow_fallback = false
